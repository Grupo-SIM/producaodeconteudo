<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--accent:#E5141B;--light:#F5F2EB;--ink:#141414;--dark:#030303;--muted:#9B9B9B;--W:1080px;--H:1920px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:#000}
#stage{position:relative;width:var(--W);height:var(--H);overflow:hidden;font-family:'Inter','Inter Display','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.cam{position:absolute;inset:0;transform-origin:50% 45%}
.light{background:var(--light);color:var(--ink)}
.dark{background:var(--dark);color:#fff}
.abs{position:absolute}
.grid{position:absolute;inset:-12%;background-size:76px 76px;
  background-image:linear-gradient(rgba(0,0,0,.075) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.075) 2px,transparent 2px);
  -webkit-mask-image:radial-gradient(ellipse 48% 34% at 50% 46%,#000 0,transparent 100%)}
.dark .grid{background-image:linear-gradient(rgba(255,255,255,.085) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.085) 2px,transparent 2px)}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 46%,rgba(255,255,255,.09),transparent 70%)}
.paper{position:absolute;inset:0;background:radial-gradient(ellipse 120% 90% at 50% 45%,rgba(255,255,255,.25),transparent 85%)}
.textbox{position:absolute;left:50px;right:50px;font-weight:700;letter-spacing:-.05em;line-height:1.0;z-index:5}
.line{display:block;white-space:nowrap}
.w{display:inline-block;margin:0 .1em;transform-origin:50% 75%;will-change:transform,filter,opacity}
.w.k{color:var(--accent);font-weight:800;font-size:1.5em;letter-spacing:-.06em;line-height:.95}
.light .w{text-shadow:0 8px 22px rgba(0,0,0,.10)}
.dark .w{text-shadow:0 0 14px rgba(255,255,255,.55),0 0 42px rgba(255,255,255,.22)}
.dark .w.k{text-shadow:0 0 16px rgba(255,30,30,.85),0 0 60px rgba(255,0,0,.45)}
.onlight .w{color:var(--ink)!important;text-shadow:none!important}
.onlight .w.k{color:var(--accent)!important}
.ticker{white-space:nowrap;display:inline-block}
.item{position:absolute;transform-origin:50% 50%;z-index:3;will-change:transform,opacity}
.item.front{z-index:6}
.emoji{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;line-height:1}
.light .shadow{filter:drop-shadow(0 38px 40px rgba(0,0,0,.22)) drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.dark .shadow{filter:drop-shadow(0 0 30px rgba(255,255,255,.22)) drop-shadow(0 20px 40px rgba(0,0,0,.8))}
/* card */
.card{width:420px;min-height:430px;background:linear-gradient(160deg,#959595,#7d7d7d);padding:44px 34px 30px;color:#fff;box-shadow:0 30px 50px rgba(0,0,0,.28),0 4px 10px rgba(0,0,0,.15)}
.card h3{font-size:68px;font-weight:700;letter-spacing:-.04em;text-align:center;padding-bottom:12px;border-bottom:5px solid #3a3a3a;margin-bottom:22px}
.card .ci{display:flex;align-items:center;gap:14px;white-space:nowrap;font-size:34px;font-weight:600;letter-spacing:-.02em;margin:14px 0}
.card .ci .ic{font-size:36px}
.card .ci .mk{flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:24px}
.orb{border-radius:50%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 18%),radial-gradient(circle at 36% 32%,color-mix(in srgb,var(--c) 62%,#fff) 0,var(--c) 52%,color-mix(in srgb,var(--c) 55%,#000) 100%);box-shadow:inset -22px -30px 60px rgba(0,0,0,.28),0 50px 70px -30px color-mix(in srgb,var(--c) 70%,transparent)}
.ringo{border-radius:50%;background:conic-gradient(from 200deg,var(--c),color-mix(in srgb,var(--c) 40%,#fff) 22%,var(--c) 45%,color-mix(in srgb,var(--c) 45%,#000) 75%,var(--c));-webkit-mask:radial-gradient(circle,transparent 54%,#000 55%);mask:radial-gradient(circle,transparent 54%,#000 55%);filter:drop-shadow(0 30px 30px rgba(0,0,0,.25))}
.pin{position:absolute;left:50%;top:-26px;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e0141b 45%,#7a0006);box-shadow:4px 10px 10px rgba(0,0,0,.3)}
/* profile */
.profile{width:900px;padding:34px 40px;border-radius:34px;background:linear-gradient(180deg,rgba(40,40,44,.92),rgba(22,22,24,.92));color:#fff;box-shadow:0 0 80px rgba(255,255,255,.12),0 40px 80px rgba(0,0,0,.6);border:1.5px solid rgba(255,255,255,.12)}
.profile .top{display:flex;justify-content:space-between;align-items:center;font-size:40px;font-weight:700;margin-bottom:28px}
.profile .row{display:flex;align-items:center;gap:40px}
.profile .av{width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#ff3d3d,#7a0b0b);display:flex;align-items:center;justify-content:center;font-size:84px;flex:none}
.profile .nm{font-size:32px;font-weight:700;margin-bottom:18px}
.profile .st{display:flex;gap:56px;font-size:30px}.profile .st b{display:block;font-size:36px}
.profile .bio{font-size:28px;line-height:1.35;margin-top:24px;color:#ddd}
.counter{font-family:'Poppins','Inter',sans-serif;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.gword{font-family:'Poppins','Inter',sans-serif;font-style:italic;font-weight:700;letter-spacing:-.03em;background:linear-gradient(90deg,#6a3df0,#c2399b 40%,#ee4a4a 65%,#f6a93b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 20px rgba(0,0,0,.12));white-space:nowrap}
.badge{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:700;letter-spacing:.08em;color:#222;opacity:.85}
.dark .badge{color:#ddd}
.badge .hd{border:3px solid currentColor;border-radius:6px;padding:1px 7px;font-size:19px}
.badge .dot{width:28px;height:28px;border-radius:50%;background:conic-gradient(currentColor 0 25%,transparent 0 50%,currentColor 0 75%,transparent 0)}
.ring{position:absolute;border-radius:50%;pointer-events:none;z-index:50;display:none}

/* ===== looks (estilos de motion) ===== */
.lk-neon .w{font-weight:800;letter-spacing:-.035em}.lk-neon .w.k{font-size:1.38em;color:var(--accent);text-shadow:0 0 10px var(--accent),0 0 34px var(--accent),0 0 80px color-mix(in srgb,var(--accent) 60%,transparent)}
.lk-neon .dark .w:not(.k){text-shadow:0 0 18px rgba(160,200,255,.35)}
.lk-neon .grid{background-image:linear-gradient(color-mix(in srgb,var(--accent) 24%,transparent) 2px,transparent 2px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 24%,transparent) 2px,transparent 2px);-webkit-mask-image:radial-gradient(ellipse 60% 40% at 50% 50%,#000 0,transparent 100%)}
.lk-neon .card{background:linear-gradient(160deg,rgba(20,28,70,.92),rgba(8,10,34,.92));border:3px solid var(--accent);box-shadow:0 0 40px color-mix(in srgb,var(--accent) 55%,transparent)}
.lk-neon .card h3{border-bottom-color:var(--accent)}.lk-neon .pin{background:var(--accent2);box-shadow:0 0 22px var(--accent2)}
.lk-neon .dark .shadow{filter:drop-shadow(0 0 34px color-mix(in srgb,var(--accent) 45%,transparent))}
.lk-minimal .textbox{letter-spacing:-.035em}.lk-minimal .w{font-weight:600;text-shadow:none!important}.lk-minimal .w.k{font-size:1.05em;font-weight:800;color:var(--accent);text-shadow:none!important;box-shadow:inset 0 -.2em 0 color-mix(in srgb,var(--accent) 22%,transparent)}
.lk-minimal .light .shadow{filter:drop-shadow(0 24px 30px rgba(0,0,0,.12))}.lk-minimal .card{background:#fff;color:#161616;box-shadow:0 30px 60px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.06);border-radius:34px}.lk-minimal .card h3{border-bottom:2px solid #e6e6e6}.lk-minimal .pin{display:none}
.lk-impacto .textbox{text-transform:uppercase;font-weight:900;letter-spacing:-.025em;line-height:.98}.lk-impacto .w{font-weight:900;text-shadow:none!important}.lk-impacto .w.k{font-size:1.18em;font-weight:900;padding:0 .22em;border-radius:.12em;transform-origin:50% 60%}
.lk-impacto .shadow{filter:drop-shadow(12px 12px 0 #000)!important}.lk-impacto .card{background:#fff;color:#000;border:6px solid #000;box-shadow:16px 16px 0 #000}.lk-impacto .card h3{border-bottom:6px solid #000}.lk-impacto .pin{background:#000;box-shadow:none}
.lk-gradiente .w{font-weight:800;text-shadow:0 6px 26px rgba(0,0,0,.22)!important}.lk-gradiente .w.k{font-size:1.3em;color:#fff;background:rgba(255,255,255,.2);border-radius:.3em;padding:0 .22em;box-shadow:0 0 0 2px rgba(255,255,255,.35) inset;text-shadow:none!important}
.lk-gradiente .card{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);backdrop-filter:blur(18px);box-shadow:0 30px 60px rgba(0,0,0,.25);border-radius:40px}.lk-gradiente .pin{display:none}.lk-gradiente .shadow{filter:drop-shadow(0 30px 40px rgba(0,0,0,.28))!important}
.blob{position:absolute;border-radius:50%;filter:blur(40px);z-index:1;pointer-events:none}
.lk-cinema .textbox{font-family:Georgia,'Times New Roman',serif;letter-spacing:-.025em}.lk-cinema .w{font-weight:500;text-shadow:0 4px 24px rgba(0,0,0,.7)!important}.lk-cinema .w.k{font-style:italic;font-weight:600;font-size:1.28em;color:var(--accent);text-shadow:0 0 30px color-mix(in srgb,var(--accent) 40%,transparent)!important}
.lk-cinema .card{background:linear-gradient(160deg,rgba(40,34,28,.94),rgba(18,15,12,.94));border:1px solid color-mix(in srgb,var(--accent) 60%,transparent)}.lk-cinema .pin{background:var(--accent);box-shadow:none}
.lk-cinetico .textbox{text-transform:uppercase;font-weight:900;letter-spacing:-.045em;line-height:.9;white-space:nowrap}.lk-cinetico .w{font-weight:900;text-shadow:none!important;margin:0}.lk-cinetico .w.k{font-size:1em;color:var(--accent)}
.lk-cinetico .shadow{filter:none!important}
.wordmode .w{position:absolute;left:50%;top:0;white-space:nowrap;display:block}
.bars{position:absolute;left:0;right:0;height:170px;background:#000;z-index:8}
.scan{position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 2px,transparent 2px 6px)}
.stripes{position:absolute;left:-5%;right:-5%;height:84px;z-index:2;transform:rotate(-2deg);background:repeating-linear-gradient(45deg,#000 0 26px,var(--accent) 26px 52px)}
.dots{position:absolute;inset:0;z-index:1;background-image:radial-gradient(currentColor 3.5px,transparent 4px);background-size:58px 58px;opacity:.13}
#grain{position:absolute;inset:0;z-index:90;pointer-events:none;opacity:.07;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;z-index:89;pointer-events:none;background:radial-gradient(ellipse 110% 85% at 50% 48%,transparent 60%,rgba(0,0,0,.14))}
</style></head>
<body><div id="stage"><div id="vig"></div><svg id="grain" width="1080" height="1920"><filter id="gf"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#gf)"/></svg></div>
<script>
// ===== easing =====
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const E={
  lin:t=>t,
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  outCubic:t=>1-Math.pow(1-t,3),
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  inCubic:t=>t*t*t,
  outBack:t=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  outElastic:t=>t===0?0:t===1?1:Math.pow(2,-9*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1
};
const prog=(t,start,dur)=>clamp((t-start)/dur);
const lerp=(a,b,p)=>a+(b-a)*p;
const mixColor=(c1,c2,p)=>{const h=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));const a=h(c1),b=h(c2);return `rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],p))).join(',')})`};
let rnd=s=>()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,((s^s>>>7)>>>0)/4294967296));

const W=1080,H=1920;
let SPEC,SCENES=[],TOTAL=0,EVENTS=[];
const stage=document.getElementById('stage');

function el(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}


// ===== looks: cada estilo de motion tem paleta, tipografia, ritmo e acabamento próprios =====
const lumOf=h=>{const m=/^#?([0-9a-f]{6})$/i.exec((h||'').trim());if(!m)return .5;const n=parseInt(m[1],16);return(((n>>16)&255)*299+((n>>8)&255)*587+(n&255)*114)/255000};
const LOOKS={
  editorial:{},
  neon:{accent:'#00E5FF',accent2:'#FF2BD6',grain:.05,vig:.35,auto:['grid','scan'],cam:[1,1.09],
    font:"'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif",
    theme:(t,sp)=>t==='dark'?{tone:'dark',bg:'radial-gradient(ellipse 80% 50% at 50% 42%,'+(sp.dark2||'#13194a')+' 0,'+(sp.dark||'#05060f')+' 72%)',ink:'#eaf2ff',from:'#3e4876',glow:1}
      :{tone:'dark',bg:'radial-gradient(ellipse 80% 50% at 50% 58%,#2b0f52 0,#07040f 74%)',ink:'#ffffff',from:'#5a4486',glow:1}},
  minimal:{accent:'#2F5BFF',grain:0,vig:0,auto:[],cam:[1,1.035],textStep:1.25,
    font:"'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif",
    theme:(t,sp)=>t==='dark'?{tone:'dark',bg:sp.dark||'#101113',ink:'#f5f5f2',from:'#5b5b5b'}:{tone:'light',bg:sp.light||'#F7F6F2',ink:'#17171a',from:'#c2c2c2'}},
  impacto:{accent:'#FFD400',grain:.06,vig:.1,auto:['stripes'],cam:[1,1.06],textStep:.8,
    font:"'Arial Black','Impact','Inter',Arial,sans-serif",
    theme:(t,sp)=>{const a=sp.accent||'#FFD400',dk=lumOf(a)<.45;return t==='dark'?{tone:'dark',bg:sp.dark||'#0a0a0a',ink:'#ffffff',from:'#777',chip:a,chipInk:dk?'#fff':'#0a0a0a'}
      :{tone:'light',bg:a,ink:dk?'#ffffff':'#0a0a0a',from:dk?'#bcbcbc':'#4a4a4a',chip:dk?'#ffffff':'#0a0a0a',chipInk:dk?'#0a0a0a':a}}},
  gradiente:{accent:'#7C3AED',accent2:'#22D3EE',grain:.05,vig:.15,auto:['blobs'],cam:[1,1.06],
    font:"'Poppins','Segoe UI','Inter',Arial,sans-serif",
    theme:(t,sp)=>t==='dark'?{tone:'dark',bg:'linear-gradient(165deg,color-mix(in srgb,var(--accent) 38%,#05030f),#05030f 78%)',ink:'#fff',from:'#8f86b8'}
      :{tone:'dark',bg:'linear-gradient(160deg,color-mix(in srgb,var(--accent) 92%,#fff 0%),color-mix(in srgb,var(--accent) 55%,var(--accent2)) 58%,color-mix(in srgb,var(--accent2) 80%,#000))',ink:'#fff',from:'#d8cdfb'}},
  cinema:{accent:'#D4A24C',grain:.14,vig:.55,auto:['bars'],cam:[1,1.13],textStep:1.4,
    font:"Georgia,'Times New Roman',serif",
    theme:(t,sp)=>t==='dark'?{tone:'dark',bg:'radial-gradient(ellipse 90% 60% at 50% 45%,#1c1c20 0,'+(sp.dark||'#050506')+' 80%)',ink:'#f1ebe0',from:'#5d584f',glow:0}
      :{tone:'dark',bg:'radial-gradient(ellipse 90% 60% at 50% 45%,#2a2118 0,#0d0a07 80%)',ink:'#f6eddc',from:'#6b6153',glow:0}},
  cinetico:{accent:'#E5141B',grain:.04,vig:0,auto:[],cam:[1,1.0],textMode:'word',textSize:210,
    font:"'Arial Black','Impact','Inter',Arial,sans-serif",
    theme:(t,sp)=>t==='dark'?{tone:'dark',bg:sp.dark||'#070707',ink:'#ffffff',from:'#ffffff'}:{tone:'light',bg:sp.light||'#F3F1EC',ink:'#0c0c0c',from:'#0c0c0c'}}
};
let LOOK=LOOKS.editorial,LOOKNAME='editorial';
// ===== decor builders =====
function blobs(parent,sc){const out=[];[['accent',.12,.18,620],['accent2',.82,.5,700],['accent',.3,.86,560]].forEach(([c,x,y,sz],j)=>{const b=el('div','blob',parent);b.style.cssText+=`left:${x*W-sz/2}px;top:${y*H-sz/2}px;width:${sz}px;height:${sz}px;background:radial-gradient(circle,var(--${c}) 0,transparent 68%);opacity:${j===1?.55:.42}`;b._b=[x*W,y*H];out.push(b)});sc.blobEls=out}
function barsDecor(parent){const a=el('div','bars',parent);a.style.top='0';const b=el('div','bars',parent);b.style.bottom='0'}
function barcode(parent,seed){const r=rnd(seed);let x=0,s='';while(x<190){const w=1+Math.floor(r()*5);if(r()>.35)s+=`<rect x="${x}" y="0" width="${w}" height="56" fill="currentColor"/>`;x+=w+1}
  const d=el('div','abs',parent,`<svg width="190" height="56">${s}</svg>`);d.style.cssText='right:110px;top:150px;opacity:.85';return d}
function curve(parent,variant){
  const paths={
    s:'M 120 -80 C 120 520, 960 520, 960 980 S 160 1500, 200 2020',
    left:'M -60 -80 C 420 200, 420 780, 120 1050 S -80 1700, 380 2020',
    right:'M 1140 -80 C 660 200, 660 780, 960 1050 S 1160 1700, 700 2020',
    arc:'M 180 -100 C 520 300, 560 700, 520 960 S 420 1600, 900 2020'};
  const d=el('div','abs',parent,`<svg width="1080" height="1920" style="overflow:visible"><path d="${paths[variant]||paths.left}" fill="none" stroke="#BEBAB3" stroke-width="128" stroke-linecap="butt" style="filter:drop-shadow(0 18px 20px rgba(0,0,0,.10))"/></svg>`);
  d.style.cssText='inset:0;z-index:1';return d}
function badge(parent,text){const d=el('div','badge abs',parent,`<span class="dot"></span><span class="hd">HD</span><span>${text||''}</span>`);d.style.cssText+='left:0;right:0;justify-content:center;bottom:250px';return d}

// ===== hero item builders =====
function buildItem(it,parent,theme){
  const wrap=el('div','item'+(it.front?' front':''),parent);
  const inner=el('div',(it.shadow===false?'':'shadow'),wrap);
  const sz=it.size||420;
  if(it.type==='emoji'){inner.classList.add('emoji');inner.style.fontSize=sz+'px';inner.textContent=it.value}
  else if(it.type==='img'){const im=el('img','',inner);im.src=it.src;im.style.width=sz+'px';im.style.display='block'}
  else if(it.type==='card'){inner.innerHTML=`<div class="card" style="position:relative"><div class="pin"></div><h3>${it.title}</h3>${(it.items||[]).map(x=>`<div class="ci">${cardMark(x.icon)}<span>${x.text}</span></div>`).join('')}</div>`;inner.style.transform=`scale(${sz/420})`}
  else if(it.type==='profile'){inner.innerHTML=`<div class="profile"><div class="top"><span>${it.handle} ⌄</span><span style="opacity:.8;font-size:34px">＋ ☰</span></div><div class="row"><div class="av emoji">${it.avatar||'🙂'}</div><div><div class="nm">${it.name||''}</div><div class="st"><span><b>${it.posts||0}</b>posts</span><span><b>${it.followers||0}</b>seguidores</span><span><b>${it.following||0}</b>seguindo</span></div></div></div><div class="bio">${(it.bio||[]).join('<br>')}</div></div>`;inner.style.transform=`scale(${sz/900})`}
  else if(it.type==='gradientWord'){inner.classList.add('gword');inner.style.fontSize=sz+'px';inner.textContent=it.text}
  else if(it.type==='counter'){inner.classList.add('counter');inner.style.fontSize=sz+'px';inner.style.color=it.color||'var(--accent)'}
  else if(it.type==='figure'){inner.innerHTML=figureSVG();inner.style.transform=`scale(${sz/700})`}
  else if(it.type==='orb'){const c=it.color||'var(--accent)';inner.innerHTML=`<div class="orb" style="width:${sz}px;height:${sz}px;--c:${c}"></div>`}
  else if(it.type==='ring'){const c=it.color||'var(--accent)';inner.innerHTML=`<div class="ringo" style="width:${sz}px;height:${sz}px;--c:${c}"></div>`}
  else if(it.type==='chart'){inner.innerHTML=chartSVG(sz,it.color||'var(--accent)');}
  else if(it.type==='circle'){inner.innerHTML=`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${it.color||'#fff'}"></div>`}
  // anchor at center
  wrap.style.left=(it.x??.5)*W+'px';wrap.style.top=(it.y??.5)*H+'px';
  inner.style.transformOrigin='50% 50%';
  wrap._it=it;wrap._inner=inner;
  // card items for sequential reveal
  wrap._cis=[...wrap.querySelectorAll('.ci')];
  return wrap;
}
function cardMark(ic){
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(),ink=lumOf(acc)>.6?'#0a0a0a':'#fff',t=String(ic||'').trim();
  const body=/^[A-Za-z0-9]{1,2}$/.test(t)?t:'<svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return `<span class="mk" style="color:${ink}">${body}</span>`;
}
function chartSVG(sz,c){

// ===== parse text spec =====
// text: "Você tem as | *ideias* e | *conteúdo*"   (| = line break, *x* = keyword)
function parseText(str){return str.split('|').map(l=>l.trim().split(/\s+/).filter(Boolean).map(w=>{const k=/^\*.*\*[.,!?]*$/.test(w);return{t:k?w.replace(/\*/g,''):w,k}}))}

// ===== build =====
function load(spec){
  SPEC=spec;const R=document.documentElement.style;
  LOOKNAME=LOOKS[spec.look]?spec.look:'editorial';LOOK=LOOKS[LOOKNAME];stage.className='lk-'+LOOKNAME;
  if(spec.accent)R.setProperty('--accent',spec.accent);else if(LOOK.accent)R.setProperty('--accent',LOOK.accent);
  R.setProperty('--accent2',spec.accent2||LOOK.accent2||'#7C3AED');
  if(spec.light)R.setProperty('--light',spec.light);
  if(spec.dark)R.setProperty('--dark',spec.dark);
  if(spec.font)stage.style.fontFamily=spec.font;else if(LOOK.font)stage.style.fontFamily=LOOK.font;
  document.getElementById('grain').style.opacity=LOOK.grain??.07;
  document.getElementById('vig').style.opacity=LOOK.vig==null?1:Math.min(1,LOOK.vig/.14);
  let t0=0;EVENTS=[];
  spec.scenes.forEach((s,i)=>{
    const theme=s.theme||'light';
    const TH=LOOK.theme?LOOK.theme(theme==='dark'?'dark':'light',spec):null;
    const sc=el('div','scene '+(TH?TH.tone:theme),stage);sc.style.zIndex=10+i;
    if(TH){sc.style.background=TH.bg;sc.style.color=TH.ink}
    const cam=el('div','cam',sc);
    if(!TH){if(theme==='light'){el('div','paper',cam)}else{el('div','glow',cam)}}else if(TH.glow){el('div','glow',cam)}
    let bgEl=null;   // fundo da biblioteca: foto ou vídeo (sequência de quadros)
    if(s.bg&&(s.bg.src||(s.bg.frames&&s.bg.frames.length))){
      const d=el('div','abs',cam);d.style.cssText='inset:0;z-index:1;overflow:hidden';
      const im=el('img','',d);im.style.cssText='width:100%;height:100%;object-fit:cover;display:block';im.src=s.bg.frames?s.bg.frames[0]:s.bg.src;
      if(s.bg.shade){const sh=el('div','abs',d);sh.style.cssText='inset:0;background:rgba(0,0,0,'+s.bg.shade+')'}
      bgEl={im,frames:s.bg.frames||null,fps:s.bg.fps||24,loop:s.bg.loop!==false,k:0};
    }
    const decor=(s.decor||[]).includes('none')?[]:[...new Set([...(s.decor||[]),...(LOOK.auto||[])])];
    if(decor.includes('grid'))el('div','grid',cam);
    if(decor.includes('dots'))el('div','dots',cam);
    if(decor.includes('scan'))el('div','scan',cam);
    if(decor.includes('stripes')){const a=el('div','stripes',cam);a.style.top='132px';const b=el('div','stripes',cam);b.style.bottom='132px'}
    const sceneFx={};
    if(decor.includes('blobs'))blobs(cam,sceneFx);
    if(decor.includes('bars'))barsDecor(sc);
    const cv=decor.find(d=>d.startsWith&&d.startsWith('curve'));if(cv)curve(cam,cv.split(':')[1]);
    if(decor.includes('barcode'))barcode(cam,i*97+13);
    if(decor.includes('badge'))badge(cam,spec.brand);
    const scatter=decor.find(d=>d.startsWith&&d.startsWith('scatter:'));
    const items=(s.items||[]).slice();
    if(scatter&&false){const e=scatter.split(':')[1];[[.92,.08,300,-15],[.08,.86,320,20],[.98,.93,260,10],[-.02,.2,220,-25]].forEach(([x,y,sz,r])=>items.unshift({type:'emoji',value:e,x,y,size:sz,rot:r,enter:'fade',idle:'spin',shadow:false,dim:true}))}
    const itemEls=items.map(it=>buildItem(it,cam,theme));
    // text blocks (s.text pode ser objeto ou lista de objetos)
    const blocks=[];const words=[];
    const Ts=Array.isArray(s.text)?s.text:(s.text?[s.text]:[]);
    let cursor=null;
    Ts.forEach(T=>{
      const mode=T.mode||LOOK.textMode||'stack';const bw=[];
      const tb=el('div','textbox'+(T.onLight&&!TH?' onlight':'')+(mode==='word'?' wordmode':''),cam);
      tb.style.fontSize=(mode==='word'&&LOOK.textSize&&(T.size||0)<LOOK.textSize*.6?LOOK.textSize:(T.size||70))+'px';tb.style.textAlign=T.align||'center';
      if(T.align==='left'){tb.style.left=(T.x??.1)*W+'px';tb.style.right='40px'}
      if(T.align==='right'){tb.style.left='40px';tb.style.right=(1-(T.x??.9))*W+'px'}
      const lines=parseText(T.value);
      if(mode==='word'){lines.flat().forEach(w=>{const sp=el('span','w'+(w.k?' k':''),tb);sp.textContent=w.t;bw.push(sp)});tb.style.height='1.1em'}
      else if(mode==='ticker'){const tk=el('span','ticker',tb);lines.flat().forEach(w=>{const sp=el('span','w'+(w.k?' k':''),tk);sp.textContent=w.t;bw.push(sp)});tb._tk=tk}
      else lines.forEach(L=>{const ln=el('span','line',tb);L.forEach(w=>{const sp=el('span','w'+(w.k?' k':''),ln);sp.textContent=w.t;bw.push(sp)})});
      if(T.rot)tb.style.transform=`rotate(${T.rot}deg)`;
      const nAll=Ts.reduce((a,x)=>a+parseText(x.value).flat().length,0);
      const start=T.start??(cursor??.12);
      const step=T.step??(mode==='word'?clamp((s.dur*.9-.1)/Math.max(1,nAll),.16,.55):clamp(((s.dur*.62-.12)/Math.max(1,nAll))*(LOOK.textStep||1),.09,.5));
      bw.forEach((w,j)=>{w._t=T.times?T.times[j]:start+j*step;EVENTS.push({t:t0+w._t,kind:w.classList.contains('k')?(theme==='dark'?'hit':'pop'):'tick'})});

    const tr=Object.assign({type:'fade',dur:.4},typeof s.in==='string'?{type:s.in}:(s.in||{}));

    if(B.mode==='word'){const fs=parseFloat(B.tb.style.fontSize)||200;B.words.forEach(w=>{w._fit=1;const ww=w.offsetWidth;if(ww>W-90)w._fit=(W-90)/ww});B.tb.style.height=Math.round(fs*1.1)+'px'}
    else{const base=B.base||(B.base=parseFloat(B.tb.style.fontSize)||70);B.tb.style.fontSize=base+'px';let wmax=0;(B.tb.querySelectorAll('.line').length?[...B.tb.querySelectorAll('.line')]:[B.tb]).forEach(n=>{const r=document.createRange();r.selectNodeContents(n);wmax=Math.max(wmax,r.getBoundingClientRect().width)});const lim=W-80,mw=Math.max(B.tb.scrollWidth,wmax);if(mw>lim)B.tb.style.fontSize=Math.max(30,base*lim/mw)+'px'}
    const y=(B.T.y??.42)*H;B.tb.style.top=(y-B.tb.offsetHeight/2)+'px'});S.sc.style.display=dp;S.sc.style.visibility=vs});
  layoutText();
  if(document.fonts&&document.fonts.ready)return document.fonts.ready.then(()=>{layoutText()});
}

// ===== per-scene local render =====
function renderScene(S,lt){
  const s=S.s,d=S.dur;
  const bg=S.bgEl;
  if(bg&&bg.frames){const n=bg.frames.length;let k=Math.floor(Math.max(0,lt)*bg.fps);k=bg.loop?k%n:Math.min(k,n-1);if(k!==bg.k){bg.k=k;bg.im.src=bg.frames[k];PENDING.push(bg.im.decode().catch(()=>{}))}}
  if(bg&&!bg.im.complete)PENDING.push(bg.im.decode().catch(()=>{}));
  // camera: slow push + keyword bump
  const cam=s.cam||{};const lc=LOOK.cam||[1,1.07];const z0=cam.from??lc[0],z1=cam.to??lc[1];
  let z=lerp(z0,z1,E.inOutCubic(clamp(lt/(d+.4))));
  let bump=0;S.words.forEach(w=>{if(w.classList.contains('k')){const p=(lt-w._t);if(p>0&&p<.35)bump+=Math.sin(p/.35*Math.PI)*.018}});
  const cr=lerp(cam.rotFrom??0,cam.rotTo??0,E.inOutCubic(clamp(lt/d)));
  S.cam.style.transform=`scale(${z+bump}) rotate(${cr}deg)`;
  if(S.fx&&S.fx.blobEls)S.fx.blobEls.forEach((b,j)=>{b.style.transform=`translate(${Math.sin(lt*.7+j*2.1)*70}px,${Math.cos(lt*.55+j*1.7)*80}px) scale(${1+Math.sin(lt*.9+j)*.08})`});
  // items
  S.itemEls.forEach((wr,j)=>{
    const it=wr._it,at=it.at??0.0,p=prog(lt,at,it.enterDur??.55);
    let o=1,tx=0,ty=0,sc=1,r=it.rot||0,bl=0;
    const en=it.enter||'pop';
    if(en==='pop'){sc=E.outBack(p);o=clamp(p*3)}
    else if(en==='fade'){o=E.outCubic(p);bl=(1-p)*12}
    else if(en==='slideL'){tx=lerp(-900,0,E.outExpo(p));r+=lerp(-25,0,E.outExpo(p))}
    else if(en==='slideR'){tx=lerp(900,0,E.outExpo(p));r+=lerp(25,0,E.outExpo(p))}
    else if(en==='slideB'){ty=lerp(1100,0,E.outExpo(p));r+=lerp(20,0,E.outExpo(p))}
    else if(en==='slideT'){ty=lerp(-1100,0,E.outExpo(p))}
    else if(en==='drop'){ty=lerp(-260,0,E.outBack(p));o=clamp(p*2.5);sc=lerp(1.25,1,E.outCubic(p))}
    else if(en==='zoom'){sc=lerp(2.2,1,E.outExpo(p));o=clamp(p*2);bl=(1-p)*20}
    const idle=it.idle||'float';
    if(idle==='float'){ty+=Math.sin(lt*2.1+j)*10;r+=Math.sin(lt*1.3+j)*1.5}
    else if(idle==='spin'){r+=lt*(it.spin??14)}
    else if(idle==='sway'){r+=Math.sin(lt*2.4+j)*5}
    else if(idle==='drift'){tx+=lt*(it.dx??-25);ty+=lt*(it.dy??0);sc*=1+lt*.03}
    if(it.dim)o*=.95;
    // optional exit
    if(it.exit!=null){const q=prog(lt,it.exit,.35);o*=1-q;sc*=1-q*.3}
    wr.style.opacity=o;
    if(it.type==='counter'){const q=E.outCubic(prog(lt,at+(it.delay??.15),it.dur??1.6)),dec=it.decimals??0,v=(it.from??0)+((it.to??100)-(it.from??0))*q;wr._inner.textContent=(it.prefix||'')+v.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec})+(it.suffix||'')}
    wr.style.transform=`translate(-50%,-50%) translate(${tx}px,${ty}px) rotate(${r}deg) scale(${sc})`;
    wr.style.filter=bl>0.1?`blur(${bl}px)`:'';
    // card list items
    if(wr._cis.length){const times=it.itemTimes||wr._cis.map((_,k)=>(at+.35)+k*(it.itemStep??.45));
      wr._cis.forEach((c,k)=>{const q=prog(lt,times[k],.35);c.style.opacity=.15+.85*E.outCubic(q);c.style.transform=`translateX(${(1-E.outExpo(q))*-30}px)`;c.style.color=''});
      if(!wr._ev){wr._ev=1;times.forEach(tt=>EVENTS.push({t:S.t0+tt,kind:'tick'}))}}
  });
  // words
  S.blocks.forEach(B=>{
  const TH=S.TH,dark=S.theme==='dark'&&!B.T.onLight;
  const base=TH?TH.ink:(dark?'#ffffff':'#141414'),from=TH?TH.from:(dark?'#6c6c6c':'#a7a7a7');
  B.words.forEach((w,j)=>{
    const k=w.classList.contains('k');const p=prog(lt,w._t,k?.5:.38);
    if(B.mode==='word'){
      const nx=B.words[j+1],on=lt>=w._t&&(!nx||lt<nx._t),q=E.outBack(prog(lt,w._t,.28)),fit=w._fit||1;
      w.style.opacity=on?clamp(q*4):0;w.style.filter='';
      w.style.transform=`translate(-50%,0) scale(${on?lerp(.72,1,q)*fit:fit})`;
      w.style.color=k?'':base;
      if(TH&&TH.chip&&k){w.style.background=TH.chip;w.style.color=TH.chipInk}
      return;
    }
    let o=E.outCubic(clamp(p*1.6)),bl=(1-E.outExpo(p))*(k?18:12),sc=k?lerp(.55,1,E.outBack(p)):lerp(.88,1,E.outExpo(p)),ty=(1-E.outExpo(p))*(k?10:28);
    if(B.mode==='ticker'){const age=B.words.filter(x=>x._t<=lt).length-1-j;if(age>0){o*=clamp(1-age*.2,.12,1);bl+=Math.min(age*1.6,6)}}
    w.style.opacity=o;w.style.filter=bl>.2?`blur(${bl}px)`:'';
    w.style.transform=`translateY(${ty}px) scale(${sc})`;
    if(!k)w.style.color=mixColor(from,base,E.outCubic(clamp((lt-w._t-.05)/.45)));
    else if(TH&&TH.chip){w.style.background=TH.chip;w.style.color=TH.chipInk;if(LOOKNAME==='impacto')w.style.transform+=` rotate(${(j%2?1:-1)*1.6}deg)`}
  });
  if(B.mode==='ticker'&&B.words.length){
    const vis=B.words.filter(x=>x._t<=lt);const cur=vis.length?vis.length-1:0;
    const cx=w=>w.offsetLeft+w.offsetWidth/2;
    const prev=B.words[Math.max(0,cur-1)],now=B.words[cur];
    const p=E.outExpo(prog(lt,now._t,.45));const c=lerp(cx(prev),cx(now),cur===0?1:p);
    B.tb._tk.style.transform=`translateX(${B.tb.clientWidth/2-c}px)`;
  }
  if(B.T.exit!=null){const q=prog(lt,B.T.exit,.3);B.tb.style.opacity=1-q;B.tb.style.filter=q>0?`blur(${q*14}px)`:''}
  });
}

// ===== frame =====
let PENDING=[];
function renderAt(t){
  PENDING=[];
  document.getElementById('turb').setAttribute('seed',Math.floor(t*24)%97+1);
  let idx=SCENES.findIndex(S=>t>=S.t0&&t<S.t0+S.dur);if(idx<0)idx=SCENES.length-1;
  SCENES.forEach(S=>{S.sc.style.display='none';S.sc.style.clipPath='';S.sc.style.opacity=1;S.sc.style.filter='';S.sc.style.transform='';if(S.ring)S.ring.style.display='none'});
  const S=SCENES[idx],lt=t-S.t0;
  S.sc.style.display='block';renderScene(S,lt);
  const tr=S.tr,P=SCENES[idx-1];
  if(P&&tr.type!=='none'&&tr.type!=='cut'&&lt<tr.dur){
    const p=lt/tr.dur;P.sc.style.display='block';renderScene(P,P.dur+lt);
    if(tr.type==='fade'){S.sc.style.opacity=E.inOutCubic(p);P.sc.style.filter=`blur(${p*10}px)`}
    else if(tr.type==='dim'){P.sc.style.filter=`brightness(${1-.75*E.inCubic(p)}) blur(${p*6}px)`;S.sc.style.opacity=E.inCubic(clamp((p-.45)/.55))}
    else if(tr.type==='zoom'){P.sc.style.transform=`scale(${1+.5*E.inCubic(p)})`;P.sc.style.filter=`blur(${p*18}px)`;S.sc.style.opacity=E.outCubic(clamp((p-.3)/.7));S.sc.style.transform=`scale(${lerp(1.18,1,E.outExpo(p))})`}
    else if(tr.type==='whip'){P.sc.style.transform=`translateX(${-W*E.inOutCubic(p)}px)`;P.sc.style.filter=`blur(${Math.sin(p*Math.PI)*16}px)`;S.sc.style.transform=`translateX(${W*(1-E.inOutCubic(p))}px)`;S.sc.style.filter=`blur(${Math.sin(p*Math.PI)*16}px)`}
    else if(tr.type==='circle'){
      const x=(tr.x??.5)*W,y=(tr.y??.45)*H,R=E.inOutCubic(p)*1500;
      S.sc.style.clipPath=`circle(${R}px at ${x}px ${y}px)`;
      const rg=S.ring;rg.style.display='block';const bw=tr.ringWidth??14;
      rg.style.left=(x-R)+'px';rg.style.top=(y-R)+'px';rg.style.width=rg.style.height=2*R+'px';
      rg.style.border=`${bw}px solid ${tr.color||'var(--accent)'}`;rg.style.boxShadow=`0 0 40px ${tr.color||'rgba(229,20,27,.6)'}`;rg.style.opacity=1-E.inCubic(p);
    }
  }
  return Promise.all(PENDING);
}
window.load=load;window.renderAt=renderAt;window.SCENES=SCENES;
// Recarrega outro spec na mesma página (editor): limpa as cenas e os anéis e monta de novo, sem recarregar a página nem as fontes
window.reload=function(spec){SCENES.forEach(S=>{S.sc.remove();if(S.ring)S.ring.remove()});SCENES.length=0;EVENTS=[];return load(spec)};
</script></body></html>
