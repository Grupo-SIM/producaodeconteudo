name: docker
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/grupo-sim/producaodeconteudo:latest
          # cache das camadas pesadas (Playwright, ffmpeg, whisper, npm): com ele, cada deploy baixa só a camada do código
          cache-from: type=gha
          cache-to: type=gha,mode=max
