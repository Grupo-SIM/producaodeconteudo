<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agentes SIM</title>
<style>
:root{
  --bg:#0c0c0d;--side:#0f0f10;--card:#141416;--card2:#111113;--line:#222225;--line2:#26262a;--field:#18181b;
  --tx:#f2f2f3;--tx2:#a5a5aa;--tx3:#6f6f75;
  --gold:#d9c08a;--gold2:#e9d29a;--goldbg:#2a2418;--goldline:#3a3220;
  --ok:#6fcf97;--warn:#d98a5a;--err:#e06060;--q:#4a4a50;
  --grad:linear-gradient(135deg,#e9d8a6,#a8864a);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,"Segoe UI",system-ui,Arial,sans-serif;letter-spacing:-.005em;display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--gold2)}a.btn{text-decoration:none}
.hidden{display:none!important}
/* menu */
.side{width:232px;background:var(--side);border-right:1px solid #1f1f22;padding:22px 14px;display:flex;flex-direction:column;gap:4px;flex:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin:0 8px 24px}
.logo{font-size:19px!important;font-weight:700!important;letter-spacing:-.01em;line-height:1.2}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#8b8b90;font-size:13.5px;border:1px solid transparent;text-align:left;width:100%}
.nv svg{width:17px;height:17px;flex:none}
.nv:hover{color:var(--tx)}
.nv.on{background:linear-gradient(180deg,#1c1c1f,#161618);color:var(--tx);border-color:#2a2a2e;box-shadow:inset 0 1px 0 #ffffff0d}
.nv b{margin-left:auto;background:var(--goldbg);color:var(--gold2);border:1px solid #4a3f26;border-radius:9px;font-size:11px;padding:0 7px;font-weight:600}
.nv b:empty{display:none}
.side .sp{margin-top:auto}
.who{font-size:12px;color:var(--tx3);padding:8px 12px}
/* principal */
.main{flex:1;min-width:0;overflow:auto;padding:20px 26px;background:radial-gradient(1200px 500px at 30% -10%,#1a1a1d 0,var(--bg) 60%)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-right:auto}
.chip{font-size:12px;background:#161618;border:1px solid var(--line2);color:var(--tx2);padding:6px 12px;border-radius:999px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;background:#1a1a1d;border:1px solid #2a2a2e;color:#d0d0d4;white-space:nowrap}
.btn.ok{background:var(--grad);color:#141006;border:none}
.btn.bl{background:var(--tx);color:var(--bg);border:none}
.btn.dg{color:#f0a0a0;border-color:#3a2224}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.box{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 1px 0 #ffffff08,0 10px 30px #0006;padding:14px}
.muted{color:var(--tx3)}.small{font-size:12px}
.f{background:var(--field);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;width:100%;outline:none}
.f:focus{border-color:var(--goldline)}
textarea.f{resize:vertical;min-height:80px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.empty{padding:40px;text-align:center;color:var(--tx3);border:1px dashed var(--line2);border-radius:16px}
.ban{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;margin-bottom:12px;background:linear-gradient(90deg,#1d1414,#121112);border:1px solid #3a2224;font-size:13px}
.ban b{color:#f0a0a0}
/* fluxo */
.lane{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 1px 0 #ffffff08,0 10px 30px #0006;padding:9px 12px;margin-bottom:8px}
.lh{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.lh .car{transition:transform .15s;color:var(--tx3)}
.lane.open .lh .car{transform:rotate(90deg)}
.lh b{font-size:14px;font-weight:600}
.sum{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px}
.sum span{padding:2px 8px;border-radius:999px;background:#1a1a1d;color:var(--tx2)}
.meta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11.5px;color:#cfd6e4}
.pb{width:70px;height:5px;background:#232326;border-radius:3px;overflow:hidden}.pb u{display:block;height:5px;background:linear-gradient(90deg,#a8864a,#e9d8a6)}
.tog{display:inline-flex;background:#0e0e0f;border:1px solid var(--line2);border-radius:999px;padding:2px}
.tog button{font-size:11px;padding:3px 9px;border-radius:999px;color:var(--tx3)}
.tog button.on{background:var(--goldbg);color:var(--gold2)}
.metain{width:44px;background:#0e0e0f;border:1px solid var(--line2);border-radius:6px;padding:2px 4px;text-align:center;font-size:11.5px}
.st{display:none;gap:6px;margin-top:8px}
.lane.open .st{display:flex}
.s{flex:1;min-width:0;background:#0e0e0f;border:1px solid #1c1c1f;border-radius:11px;padding:6px;display:flex;flex-direction:column;gap:5px;min-height:54px}
.s.me{background:linear-gradient(180deg,#19160f,#121110);border-color:var(--goldline)}
.s.done{background:#0f1311;border-color:#1c2a22}
.sh{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);display:flex;justify-content:space-between;font-weight:500}
.s.me .sh{color:var(--gold)}.s.done .sh{color:#7fbf98}
.c{background:var(--field);border:1px solid var(--line2);box-shadow:inset 2px 0 0 var(--ok);border-radius:8px;padding:5px 7px;font-size:11.5px;line-height:1.3;cursor:pointer;text-align:left;width:100%}
.c i{font-style:normal;font-size:10px;color:#7b7b82;display:block}
.c.y{box-shadow:inset 2px 0 0 var(--gold)}.c.aj{box-shadow:inset 2px 0 0 var(--warn)}.c.aj i{color:#d9a07a}
.c.e{box-shadow:inset 2px 0 0 var(--err);background:#1d1414;border-color:#3a2224}.c.e i{color:#e88}
.c.q{box-shadow:inset 2px 0 0 var(--q)}.c.d{opacity:.65}
.tagaj{display:inline-block;font-size:9.5px;background:#2a1a10;color:#f0b080;border-radius:6px;padding:0 5px;margin-left:4px}
.leg{display:flex;gap:16px;font-size:11px;color:var(--tx3);margin-top:10px;flex-wrap:wrap}
.leg span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
table.lst{width:100%;border-collapse:collapse;font-size:13px}
table.lst td,table.lst th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.lst th{color:var(--tx3);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
table.lst tr:hover td{background:#141416;cursor:pointer}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:#1a1a1d;color:var(--tx2);white-space:nowrap}
.pill.esperando{background:var(--goldbg);color:var(--gold2)}.pill.ajuste{background:#2a1a10;color:#f0b080}
.pill.parado{background:#2a1416;color:#f0a0a0}.pill.finalizado{background:#0f1a14;color:#7fbf98}.pill.etapa{background:#10181a;color:#8fd0c0}
/* marca */
.msel{position:relative}
.mpop{position:absolute;right:0;top:110%;width:260px;background:#111113;border:1px solid var(--line2);border-radius:12px;padding:8px;z-index:30;box-shadow:0 20px 40px #000a}
.mpop .it{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13px}
.mpop .it:hover{background:#1a1a1d}
.mpop .pin{margin-left:auto;color:var(--tx3);font-size:12px}.mpop .pin.on{color:var(--gold)}
/* mesa */
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card .pv{aspect-ratio:4/5;background:#0f0f10;display:grid;place-items:center;position:relative;overflow:hidden}
.card .pv img{width:100%;height:100%;object-fit:cover}
.card .pv.txt{place-items:start;padding:38px 14px 14px;font-size:12px;color:var(--tx2);white-space:pre-wrap;overflow:hidden}
.card .tp{position:absolute;left:8px;top:8px;background:#000b;font-size:11px;padding:2px 8px;border-radius:999px}
.card .bd{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .ac{display:flex;gap:6px;margin-top:auto}
.card .ac .btn{flex:1;justify-content:center}
/* chat */
.chat{width:360px;flex:none;background:#0f0f10;border-left:1px solid #1f1f22;display:flex;flex-direction:column;min-height:0}
.ch{padding:16px 18px;border-bottom:1px solid #1f1f22;font-weight:600;display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84}
.ch .x{margin-left:auto;display:none;font-size:20px;color:var(--tx3)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.45}
.m{padding:9px 12px;border-radius:12px;max-width:90%;white-space:pre-wrap;word-wrap:break-word}
.m.u{background:var(--tx);color:var(--bg);align-self:flex-end}
.m.g{background:var(--field);border:1px solid var(--line2)}
.m small{display:block;color:#c9b37f;margin-top:6px;font-size:11.5px}
.m .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.typing{font-size:12px;color:var(--tx3);padding:0 16px 6px}
.sugs{display:flex;gap:6px;padding:0 14px;overflow-x:auto}
.sugs button{font-size:11.5px;border:1px solid var(--line2);background:#161618;border-radius:999px;padding:5px 10px;white-space:nowrap;color:var(--tx2)}
.cin{display:flex;gap:8px;margin:12px 14px 14px;padding:6px;background:#161618;border:1px solid var(--line2);border-radius:12px}
.cin textarea{flex:1;background:none;border:none;outline:none;resize:none;padding:6px;height:38px;max-height:120px}
.fab{display:none}
/* modal / editor */
.ov{position:fixed;inset:0;background:#000a;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.mo{background:#111113;border:1px solid var(--line2);border-radius:18px;width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.mo.sm{width:min(480px,100%)}
.hd,.ft{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #1f1f22;flex-wrap:wrap}
.ft{border-bottom:none;border-top:1px solid #1f1f22}
.hd h2{font-size:16px;font-weight:600;margin-right:auto}
.mb{padding:16px;overflow:auto;flex:1}
.ask{display:flex;gap:8px;padding:10px 16px;background:#141210;border-bottom:1px solid var(--goldline)}
.doc{min-height:380px;font-size:15px;line-height:1.65;background:#0e0e0f;border:1px solid var(--line2);border-radius:12px;padding:20px 22px;outline:none;white-space:pre-wrap}
.learn{font-size:12px;color:var(--gold);margin-right:auto}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:#161618;border:1px solid var(--line2);color:var(--tx2);border-radius:999px;padding:5px 12px;font-size:12px}
.tabs button.on{background:var(--tx);color:var(--bg)}
.ver{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c1c1f;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;z-index:99;font-size:13px;box-shadow:0 10px 30px #000a}
.login{margin:auto;width:min(360px,92vw)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}.kv dt{color:var(--tx3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{background:#0e0e0f;border:1px solid #1c1c1f;border-radius:10px;min-height:86px;padding:6px;font-size:11px}
.cal div b{color:var(--tx3);font-weight:500}
.cal span{display:block;margin-top:4px;background:var(--field);border-radius:6px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bell{position:relative}.bell i{position:absolute;top:-5px;right:-5px;background:#e06060;color:#fff;font-style:normal;font-size:10px;border-radius:999px;padding:0 5px}.bell i:empty{display:none}
.pop{position:absolute;right:0;top:110%;width:340px;max-height:420px;overflow:auto;background:#111113;border:1px solid var(--line2);border-radius:12px;padding:6px;z-index:40;box-shadow:0 20px 40px #000a}
.pop .it{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}.pop .it:hover{background:#1a1a1d}.pop .it small{display:block;color:var(--tx3)}.pop .it.nova{border-left:2px solid var(--gold)}
.gsearch{position:relative}.gsearch input{width:220px}
.esch{position:absolute;display:flex;gap:6px;z-index:5;flex-wrap:wrap}.esch>div{background:#111113e0;border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:11.5px;color:var(--tx2)}.esch b{color:var(--tx);font-size:16px;margin-right:4px}
.escf{position:absolute;left:12px;bottom:12px;width:300px;display:flex;flex-direction:column;gap:4px;z-index:5}.escf div{background:#111113e0;border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:11.5px}.escf small{display:block;color:var(--tx3);font-size:10px}
#escw:fullscreen{border-radius:0}
.mnav{display:none;gap:8px;justify-content:center;margin-top:10px}
/* fiel aos protótipos */
.sidetools{display:flex;gap:6px;margin:-12px 4px 14px}.sidetools .gsearch{flex:1}.sidetools .gsearch input{width:100%;padding:6px 10px;font-size:12.5px}.sidetools .pop{left:0;right:auto}
.gasto{font-size:11.5px;color:#8a93a6;padding:10px 12px;border-top:1px solid var(--line);margin-bottom:6px}.gasto b{color:#dde;font-size:14px}
.prob{background:#2a1214;border:1px solid #6b2a2e;border-radius:11px;padding:8px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;font-size:12.5px}.prob b{color:#ff6b6b}.prob span{color:#f2c4c4}.prob button{margin-left:auto;background:#ff6b6b;color:#2a0a0a;padding:5px 12px;border-radius:8px;font-weight:700}
.chip.gold{background:var(--grad);color:#141006;border:none;font-weight:600}.chip.gold-line{border-color:#c9a86a;background:linear-gradient(135deg,#e9d8a6,#a8864a);color:#141006}.chip.gold-line b{color:#141006}
.lh .sub{font-size:11.5px;color:#8a93a6}.lh .car{font-size:18px;line-height:1;width:12px}
.sum span{background:none;border:1px solid #2a2a2e;padding:2px 9px}.sum .g{color:#7fd1a0;border-color:#1f3a2a}.sum .y{color:var(--gold2);border-color:#4a3f26}.sum .r{color:#f0a0a0;border-color:#4a2224}.sum .d{color:var(--tx2)}
.meta .mt{cursor:pointer}.lane:not(.open){padding:12px 14px}
.sh i{font-style:normal;text-transform:none;letter-spacing:0;color:#aeb7c8;font-size:10px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mgrid .pv{aspect-ratio:auto;height:210px;background:linear-gradient(160deg,#141416,#1d1a12 60%,#0c0c0d)}
.mgrid .pv.texto{background:#111113}
.mgrid .pv .txt{position:absolute;inset:44px 20px 14px;font-size:13px;color:var(--tx2);overflow:hidden}.mgrid .pv .txt p{margin-bottom:4px}.mgrid .pv .txt b{color:var(--tx)}.mgrid .pv .txt h4{font-size:15px;color:var(--tx);margin-bottom:10px}
.mgrid .pv .head{position:absolute;left:20px;right:20px;top:44px;font-size:21px;font-weight:700;line-height:1.2;color:#fff}
.mgrid .play{width:52px;height:52px;border-radius:50%;background:#ffffffd0;color:#111;display:grid;place-items:center;font-size:18px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.card .tp{background:#000b;font-weight:600;font-size:11px;left:12px;top:12px}.card .age{position:absolute;right:12px;top:12px;background:#000b;color:var(--gold2);font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
.chat .sugs{display:none}.chat.open .sugs{display:flex}
.note{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:14px;background:linear-gradient(90deg,#1a1710,#121112);border:1px solid var(--goldline);margin-bottom:14px}.note b{font-size:15px}.note span{font-size:13px;color:var(--tx2)}.tagg{margin-left:auto;background:var(--goldbg);color:var(--gold2)!important;border-radius:999px;padding:4px 12px;white-space:nowrap}
.redes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:14px}.redes .box{display:flex;flex-direction:column;gap:4px}.redes i{width:30px;height:30px;border-radius:8px;margin-bottom:8px}.redes b{font-size:14px}.redes span{font-size:12px;color:var(--tx3);margin-bottom:10px}.redes .btn{justify-content:center;margin-top:auto}
.pub2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.bh b{font-size:15px}.bh span{font-size:12px;color:var(--tx3)}
.cal2{display:grid;grid-template-columns:60px repeat(7,1fr);gap:6px;font-size:11.5px}.cal2>b{text-align:center;color:var(--tx3);font-weight:500}.cal2>i{font-style:normal;color:var(--tx3);padding-top:8px}.cal2>div{min-height:56px;border:1px solid #1f3a2a;border-radius:8px;padding:3px;display:flex;flex-direction:column;gap:3px;background:#141416}.cal2 span{color:#fff;border-radius:6px;padding:3px 6px;cursor:pointer;line-height:1.2}
.pp{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.pp .th{width:46px;height:56px;border-radius:8px;background:linear-gradient(160deg,#1d1a12,#000);overflow:hidden;flex:none}.pp .th img{width:100%;height:100%;object-fit:cover}.pp b{display:block;font-size:13.5px}.pp span{font-size:12px;color:var(--tx3)}.pa{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mlay{display:grid;grid-template-columns:460px 1fr;gap:16px;align-items:start}.mcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mc{cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:14px}.mc.on{border-color:#a8864a!important}.mc b{font-size:14px}.mc.add{border-style:dashed;align-items:center;justify-content:center;color:var(--tx2)}
.av{width:36px;height:36px;border-radius:9px;background:#1c1c1f;display:grid;place-items:center;font-size:12px;font-weight:700;margin-bottom:8px}.av.gold{width:52px;height:52px;border:1px solid #a8864a;color:var(--gold2);background:#1a1710;margin:0}
.mdet .mh{display:flex;gap:14px;align-items:center;margin-bottom:14px}.mdet h2{font-size:19px;font-weight:600}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}h5{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin-bottom:8px}
.kvr{display:flex;justify-content:space-between;gap:12px;background:#161618;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13px}.sec{background:#161618;border-radius:10px;padding:10px 12px;margin-bottom:8px}.sec b{display:block;font-size:12px;letter-spacing:.04em;color:var(--gold2);margin-bottom:4px}.sec p{font-size:13px;color:var(--tx2);line-height:1.5}.sec em{font-style:normal;font-size:10.5px;border-radius:5px;padding:1px 6px;margin:0 2px}.sec em.prop{background:#10241a;color:#7fd1a0}.sec em.conf{background:#2a2014;color:#e9b87a}
.hexes{display:flex;gap:10px;margin-top:6px;font-size:11.5px;color:var(--tx2);font-family:ui-monospace,monospace}
.arqs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.arqs figure{margin:0}.arqs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#161618}.arqs figcaption{font-size:11px;color:var(--tx3);text-align:center;margin-top:3px}

    <button class="nv ${['marcas', 'produtos', 'otimizacao', 'config', 'mais'].includes(S.view) && isMobile() ? 'on' : ''}" style="${isMobile() ? '' : 'display:none'}" onclick="go('mais')">${ico('mais')}<span>Mais</span></button>

function go(v) { if (v !== 'cerebro') { C3?.destruir(); C3 = null; } if (v !== 'fluxo') { E3?.destruir(); E3 = null; } S.view = v; location.hash = v; renderSide(); render(); window.scrollTo(0, 0); if (['fluxo', 'mesa', 'publicacao'].includes(v)) refresh().catch(() => { }); }
async function logout() { await api('/api/logout', { body: {} }).catch(() => { }); location.reload(); }
const VIEWS = {};
function render() { (VIEWS[S.view] || VIEWS.fluxo)(); }

// ───────── dados
let refreshT;
async function refresh() {
  const q = S.marca ? '?marca=' + encodeURIComponent(S.marca) : '';
  S.fluxo = await api('/api/v2/fluxo' + q);
  // erro antigo de configuração (já corrigido no servidor) não é problema seu: o item conta como na fila até rodar de novo
  // o que se resolve sozinho (limite da assinatura, resposta vazia, erro antigo) não é problema seu: conta como fila e o servidor tenta de novo
  S.autoRetry = 0;
  for (const i of S.fluxo.itens) if (i.estado === 'parado' && explica(i.motivo).auto) { Object.assign(i, { estado: 'fila', motivo: '', retenta: true }); S.autoRetry++; }
  S.fluxo.avisos = S.fluxo.itens.filter(i => i.estado === 'parado').slice(0, 5).map(i => ({ id: i.id, titulo: i.titulo, motivo: i.motivo }));
  renderSide();
  if (!$('.ov') && ['fluxo', 'mesa', 'publicacao'].includes(S.view)) render();
}
function live() {
  try {
    const es = new EventSource('/api/stream');
    es.addEventListener('change', () => { clearTimeout(refreshT); refreshT = setTimeout(() => { refresh().catch(() => { }); loadChat().catch(() => { }); notifs().catch(() => { }); }, 400); });
  } catch { setInterval(refresh, 15000); }
}

// ───────── seletor de marca (com busca e fixadas)

function togglePop(e) { e.stopPropagation(); const p = $('#mpop'); p.classList.toggle('hidden'); if (!p.classList.contains('hidden')) { fillPop(''); p.querySelector('input').focus(); } }
function fillPop(q) {
  const l = S.brands.map(b => b.name).filter(n => n.toLowerCase().includes(q.toLowerCase())).sort((a, b) => (S.fix.includes(b) - S.fix.includes(a)) || a.localeCompare(b));

}
function pin(n) { S.fix = S.fix.includes(n) ? S.fix.filter(x => x !== n) : [...S.fix, n]; store.set('marcasFixas', S.fix); fillPop($('#mpop input').value); }
function setMarca(n) { S.marca = n; store.set('marca', n); refresh(); }
document.addEventListener('click', () => $('#mpop')?.classList.add('hidden'));

async function notifs(primeira) {

// ───────── problemas em linguagem simples: o que aconteceu e o que depende de você
function explica(motivo) {
  const m = String(motivo || '');
  if (/limite de uso/i.test(m)) return { auto: true, causa: 'limite', titulo: 'A assinatura do Claude atingiu o limite de uso', faca: 'Espere o limite renovar (algumas horas) e clique em Resolvido. Se quiser evitar, diminua as metas por dia.' };
  if (/dangerously-skip-permissions|root\/sudo/i.test(m)) return { auto: true, causa: 'config', titulo: 'Erro de configuração do servidor (já corrigido)', faca: 'Nada a fazer além de clicar em Resolvido: o item volta para a fila e roda de novo.' };
  if (/login|logad|autentic|credencia|401/i.test(m)) return { causa: 'login', titulo: 'A assinatura do Claude saiu do login', faca: 'Vá em Configurações → Conectar ou trocar a conta, entre de novo e depois clique em Resolvido.' };
  if (/sem resposta|código 1|timeout|tempo/i.test(m)) return { auto: true, causa: 'falha', titulo: 'O Claude parou sem responder', faca: 'Clique em Resolvido para tentar de novo. Se repetir, confira a assinatura em Configurações.' };
  if (/sem tarefa/i.test(m)) return { auto: true, causa: 'fila', titulo: 'O item ficou sem a próxima etapa', faca: 'Clique em Resolvido para a produção recomeçar de onde parou.' };
  if (/revis|reprov|travou|bloque/i.test(m)) return { causa: 'revisao', titulo: 'O revisor reprovou várias vezes', faca: 'Abra o item e decida: peça um ajuste dizendo o que mudar, aprove assim mesmo ou clique em Resolvido para refazer.' };
  if (/fal\.ai|imagem|saldo|crédit/i.test(m)) return { causa: 'imagem', titulo: 'A geração de imagem falhou', faca: 'Confira o saldo da fal.ai em Configurações avançadas e clique em Resolvido.' };
  return { causa: 'outro', titulo: 'O agente parou com um erro', faca: 'Clique em Resolvido para tentar de novo. Se repetir, me pergunte no chat o que houve.' };
}
function abreProblemas() {
  const L = S.fluxo.itens.filter(i => i.estado === 'parado'), grupos = {};
  for (const i of L) { const e = explica(i.motivo); (grupos[e.causa] ||= { ...e, itens: [] }).itens.push(i); }
  const G = Object.values(grupos);
  modal(`<div class="hd"><h2>${L.length} problema${L.length === 1 ? '' : 's'} para resolver</h2><button class="btn sm" onclick="fecha()">Fechar</button></div><div class="mb">
    ${G.map((g, k) => `<details class="prob2" ${k === 0 ? 'open' : ''}><summary><b>${esc(g.titulo)}</b><span class="pill parado">${g.itens.length} ${g.itens.length === 1 ? 'item' : 'itens'}</span></summary>
      <div class="pfaca"><b>O que fazer:</b> ${esc(g.faca)}</div>
      ${g.itens.map(i => `<div class="kvr"><span style="cursor:pointer" onclick="abrirItem(${i.id})">${esc(i.titulo)} <small class="muted">${esc(i.marca)} · ${esc(S.fluxo.formatos.find(f => f.id === i.raia)?.nome || '')}</small></span><span><button class="btn sm" onclick="abrirItem(${i.id})">Abrir</button><button class="btn sm ok" onclick="resolver([${i.id}])">Resolvido</button></span></div>`).join('')}
      ${g.itens.length > 1 ? `<button class="btn ok" style="margin-top:8px" onclick="resolver([${g.itens.map(i => i.id)}])">Marcar os ${g.itens.length} como resolvidos</button>` : ''}</details>`).join('') || '<div class="empty">Nenhum problema agora.</div>'}</div>`);
}
async function resolver(ids) {
  try { for (const id of ids) await api(`/api/v2/itens/${id}/resolver`, { body: {} }); toast(ids.length > 1 ? `${ids.length} itens voltaram para a produção` : 'Resolvido: o item voltou para a produção'); } catch (e) { toast(e.message); }
  await refresh(); if ($('.ov')) { if (S.fluxo.itens.some(i => i.estado === 'parado')) abreProblemas(); else fecha(); }
}

// ───────── Fluxo
const COR = { etapa: 'var(--ok)', esperando: 'var(--gold)', ajuste: 'var(--warn)', parado: 'var(--err)', fila: 'var(--q)' };
const LEG = { etapa: 'agente trabalhando', esperando: 'esperando você', ajuste: 'em ajuste', parado: 'parado', fila: 'na fila (ainda não começou)' };
const CLS = { etapa: '', esperando: 'y', ajuste: 'aj', parado: 'e', fila: 'q', finalizado: 'd' };
// colunas de cada raia (como nos protótipos): [id, nome, quem faz | '' quando é você]
const COLS = {
  carrossel: [['roteiro', 'Roteiro', 'Roteirista'], ['copy', 'Revisão de copy', 'Revisor de copy'], ['ap_roteiro', 'Aprovar roteiro', ''], ['arte', 'Arte', 'Designer'], ['ap_final', 'Aprovar arte', ''], ['postagem', 'Postagem', 'Publicador'], ['fim', 'Finalizado', '']],
  estatico: [['roteiro', 'Roteiro', 'Roteirista'], ['copy', 'Revisão de copy', 'Revisor de copy'], ['ap_roteiro', 'Aprovar texto', ''], ['arte', 'Arte', 'Designer'], ['ap_final', 'Aprovar arte', ''], ['postagem', 'Postagem', 'Publicador'], ['fim', 'Finalizado', '']],
  stories: [['roteiro', 'Roteiro', 'Roteirista'], ['copy', 'Revisão de copy', 'Revisor de copy'], ['ap_roteiro', 'Aprovar roteiro', ''], ['arte', 'Arte', 'Designer'], ['ap_final', 'Aprovar telas', ''], ['postagem', 'Postagem', 'Publicador'], ['fim', 'Finalizado', '']],
  reels: [['roteiro', 'Roteiro', 'Roteirista'], ['copy', 'Revisão de copy', 'Revisor de copy'], ['ap_roteiro', 'Aprovar roteiro', ''], ['arte', 'Edição', 'Editor de vídeo'], ['ap_final', 'Aprovar vídeo', ''], ['postagem', 'Postagem', 'Publicador'], ['fim', 'Finalizado', '']],
  materia: [['roteiro', 'Pauta e texto', 'Roteirista + SEO'], ['copy', 'Revisão', 'Revisor de copy'], ['ap_roteiro', 'Aprovar matéria', ''], ['arte', 'Arte', 'Designer'], ['ap_final', 'Aprovar arte', ''], ['postagem', 'Publicação', 'Publicador'], ['fim', 'Finalizado', '']],
  blog: [['roteiro', 'Texto', 'Roteirista'], ['copy', 'Revisão de copy', 'Revisor de copy'], ['ap_final', 'Aprovar texto', ''], ['postagem', 'Publicação', 'Publicador'], ['fim', 'Finalizado', '']]
};
const SUBR = { carrossel: 'educativo · história real · post de venda', estatico: 'post único', stories: 'telas de venda · caixinha', reels: 'voz de IA · motion', materia: 'site · fato com fonte', blog: 'aula escrita' };
function colunaDe(i) {
  if (i.estado === 'finalizado') return 'fim';
  if (i.estado === 'esperando') return i.etapa === 'publicacao' ? 'postagem' : i.roteiro ? 'ap_roteiro' : 'ap_final';
  const e = i.etapa;
  return e === 'roteirista' || e === 'radar' ? 'roteiro' : e === 'revisorcopy' || e === 'gerente' || e === 'seo' ? 'copy' : e === 'designer' || e === 'editor' ? 'arte' : e === 'publicador' ? 'postagem' : 'roteiro';
}
const FAZENDO = e => ({ roteirista: 'Roteirista escrevendo', radar: 'Agente de Notícias pesquisando', revisorcopy: 'Revisor de Copy revisando', seo: 'Agente de SEO revisando a matéria', gerente: 'Revisor revisando', designer: 'Designer criando a arte', editor: 'Editor montando o vídeo', publicador: 'Social Media montando o pacote' })[e] || 'Trabalhando';
// em vez de "aguardando": diz o que vem e por que ainda não começou
function porQueAguarda(i) {
  const f = i.fila, quem = FAZENDO(i.etapa).split(' ')[0] === 'Agente' ? FAZENDO(i.etapa).split(' ').slice(0, 3).join(' ') : FAZENDO(i.etapa).split(' ')[0];
  if (!f) return `passando para ${quem}`;
  if (f.manual) return `${quem}: esperando você levar o pedido ao chat`;
  if (f.limite) return `fila parada: o limite de ${f.limite} tarefas por dia acabou · volta amanhã (ou aumente em Configurações)`;
  if (f.pos === 1 && !f.ocupado) return f.rodando >= f.vagas ? `${quem} é o próximo · começa quando abrir vaga (${f.rodando} de ${f.vagas} agentes trabalhando ao mesmo tempo)` : `${quem} começa agora`;
  if (f.pos === 1) return `${quem} começa assim que terminar a tarefa atual`;
  if (f.pos <= 0) return `passando para ${quem}`;
  return `${f.pos}º na fila do ${quem}${f.ocupado ? ' (trabalhando em outra agora)' : ''}`;
}
function cartao(i) {
  const sub = i.estado === 'parado' ? 'parou: ' + explica(i.motivo).titulo.toLowerCase() : i.em_ajuste ? `ajuste: "${i.ajuste_motivo}"` : i.estado === 'fila' ? (i.retenta ? 'volta sozinho quando o limite renovar' : 'na fila' + (i.quando ? ' · ' + fmtD(i.quando) : '')) : i.estado === 'finalizado' ? 'postado' : i.estado === 'esperando' ? (i.etapa === 'publicacao' ? 'marcar postado' : '') : i.aguardando ? porQueAguarda(i) : FAZENDO(i.etapa) + ' agora';
  const vivo = (i.estado === 'etapa' || i.estado === 'ajuste') && !i.aguardando;   // agente trabalhando agora: ponto pulsando e barra correndo
  return `<button class="c ${CLS[i.estado]}${i.em_ajuste ? ' aj' : ''}${vivo ? ' vivo' : ''}" onclick="abrirItem(${i.id})">${esc(i.titulo)}<i>${vivo ? '<b class="pulso"></b>' : ''}${[i.marca, sub].filter(Boolean).map(esc).join(' · ')}</i>${vivo ? '<u class="corre"></u>' : ''}</button>`;
}
VIEWS.fluxo = () => {
  const F = S.fluxo; if (!F) return;
  if (isMobile() && S.modoFluxo !== 'escritorio') return fluxoCel();
  const nM = S.brands.length, aviso = F.avisos[0];
  const ban = F.avisos.length ? `<div class="prob"><b>${F.avisos.length} problema${F.avisos.length > 1 ? 's' : ''}</b><span>${esc(explica(aviso.motivo).titulo)} · ${esc(aviso.titulo)}${F.avisos.length > 1 ? ` e mais ${F.avisos.length - 1}` : ''}</span><button onclick="abreProblemas()">Resolver</button></div>` : '';
  const head = `<div class="top"><h1>Fluxo</h1><button class="chip ${S.modoFluxo === 'lista' ? 'on' : ''}" onclick="S.modoFluxo='lista';store.set('modoFluxo','lista');E3?.destruir();E3=null;render()">Lista</button><button class="chip ${S.modoFluxo === 'escritorio' ? 'on' : ''}" onclick="S.modoFluxo='escritorio';store.set('modoFluxo','escritorio');render()">Escritório</button><span style="flex:1"></span>
    ${marcaSel(`Marca: <b>${esc(S.marca || `Todas (${nM})`)}</b> ▾`)}${S.modoFluxo === 'escritorio' ? `<button class="chip" onclick="telao()">${store.get('telaoOn', true) ? 'Desligar telão' : 'Ligar telão'}</button><button class="chip" onclick="trocaVideo()">Vídeo</button><button class="chip" id="btnTela" onclick="telaCheia()">${document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia'}</button>` : `<button class="chip" onclick="treinoDesigner()">Treino do Designer</button><button class="chip gold" onclick="novoConteudo()">+ Novo conteúdo</button>`}</div>`;
  if (S.modoFluxo === 'escritorio') return escritorio3d(head, ban);
  E3?.destruir(); E3 = null;
  const lanes = F.formatos.filter(f => f.ativo).map(f => {
    const its = F.itens.filter(i => i.raia === f.id), aberta = S.abertas[f.id] ?? its.some(i => i.estado !== 'finalizado');
    const cols = COLS[f.id] || COLS.carrossel;
    const feitos = its.filter(i => ['finalizado', 'esperando'].includes(i.estado) && (i.atualizado || '').slice(0, 10) === new Date().toISOString().slice(0, 10)).length;
    const pct = f.meta_dia ? Math.min(100, Math.round(100 * feitos / f.meta_dia)) : 0;
    const c = f.contagem, sum = aberta ? '' : [['g', (c.etapa || 0) + (c.ajuste || 0), 'trabalhando'], ['y', c.esperando || 0, 'esperando você'], ['r', c.parado || 0, 'parado'], ['d', c.finalizado || 0, 'finalizado']].filter((x, k) => x[1] || k === 0).map(([k, v, t]) => `<span class="${k}">${v} ${t}</span>`).join('');
    return `<div class="lane ${aberta ? 'open' : ''}"><div class="lh" onclick="raia('${f.id}')"><span class="car">›</span><b>${esc(f.nome)}</b><span class="sub">${SUBR[f.id] || ''}</span><span class="sum">${sum}</span>
      <span class="meta" onclick="event.stopPropagation()"><span class="mt" title="Clique para mudar a meta" onclick="mudaMeta('${f.id}',${f.meta_dia})">Meta ${f.meta_dia}/dia · ${feitos} de ${f.meta_dia}</span><span class="pb"><u style="width:${pct}%"></u></span><button class="chip ${f.modo === 'automatico' ? 'gold' : ''}" title="Alternar Manual/Automático" onclick="setFormato('${f.id}',{modo:'${f.modo === 'manual' ? 'automatico' : 'manual'}'})">${f.modo === 'manual' ? 'Manual' : 'Automático'}</button></span></div>
      <div class="st">${cols.map(([id, nome, quem]) => { const cs = its.filter(i => colunaDe(i) === id); return `<div class="s ${!quem && id !== 'fim' ? 'me' : id === 'fim' ? 'done' : ''}"><div class="sh">${esc(nome)}<i>${esc(quem)}</i></div>${cs.slice(0, 6).map(cartao).join('')}${cs.length > 6 ? `<span class="small muted">+${cs.length - 6}</span>` : ''}</div>`; }).join('')}</div></div>`;
  }).join('');
  const leg = `<div class="leg">${Object.entries(COR).map(([k, c]) => `<span style="--c:${c}">${LEG[k]}</span>`).join('')}</div>`;
  const info = S.autoRetry ? `<p class="small muted" style="margin:-4px 0 10px">${S.autoRetry} item(ns) esperando o limite da assinatura do Claude renovar: voltam para a produção sozinhos, você não precisa fazer nada.</p>` : '';

const docsMarca = nome => (S._docs || []).filter(x => (x.brand || '').toLowerCase() === nome.toLowerCase());
function achaTrecho(nome, titulo) {
  for (const doc of docsMarca(nome)) {
    const L = String(doc.content || '').split('\n'), i = L.findIndex(l => tituloDe(l.trim()) === titulo); if (i < 0) continue;
    let f = i + 1; while (f < L.length && !(L[f].trim() && tituloDe(L[f].trim()))) f++;
    return { doc, L, i, f };
  }
}
function editaSecao(nome, titulo) {

}
function editaCampo(nome, chave) {
  const re = new RegExp('^(\\s*[-*]?\\s*' + chave.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ':\\s*)(.+)$');
  const doc = docsMarca(nome).find(d => String(d.content || '').split('\n').some(l => re.test(l))); if (!doc) return toast('Não achei este campo nos documentos da marca');
  const v = String(doc.content).split('\n').find(l => re.test(l)).match(re)[2];
  S._ed = { tipo: 'campo', nome, chave, re };
  modal(`<div class="hd"><h2>${esc(chave)}</h2><span class="muted small">${esc(doc.title)}</span><button class="btn sm" onclick="fecha()">Fechar</button></div><div class="mb"><div class="leitura" style="margin-bottom:10px"><p>${sw(v)}</p></div><textarea class="f" id="edTxt" rows="4">${esc(v)}</textarea></div><div class="ft"><span class="muted small" style="margin-right:auto">Salva no documento da marca, que os agentes leem.</span><button class="btn ok" onclick="salvaEd()">Salvar</button></div>`, 'sm');

  else { doc = docsMarca(e.nome).find(d => String(d.content).split('\n').some(l => e.re.test(l))); if (!doc) return toast('O campo mudou: reabra'); let feito = false; content = String(doc.content).split('\n').map(l => !feito && e.re.test(l) ? (feito = true, l.replace(e.re, (_, a) => a + novo.replace(/\n+/g, ' '))) : l).join('\n'); }

}
async function chatSend(t) {
  const text = t || $('#cin').value.trim(); if (!text) return; $('#cin').value = '';
  $('#typing').classList.remove('hidden');
  if (S.view === 'cerebro') cerAcende(text).catch(() => { });
  try { await api('/api/gerente/chat', { body: { text } }); } catch (e) { toast(e.message); }
  await loadChat(); refresh();
}
async function desfazRegra(id, b) { b.disabled = true; await tryDo(() => api(`/api/v2/regras/${id}/desfazer`, { body: {} }), 'Regra desfeita'); loadChat(); }
function chatToggle(on) { $('#chat').classList.toggle('open', on); if (on) { S.lidas = S.chat.at(-1)?.id || 0; store.set('chatLidas', S.lidas); $('#fabcnt').textContent = ''; } }
$('#sugs').innerHTML = SUGS.map(s => `<button onclick="chatSend(${esc(JSON.stringify(s))})">${esc(s)}</button>`).join('');

// ───────── modal
function modal(html, cls = '') { $('#ovs').innerHTML = `<div class="ov" onclick="if(event.target===this)fecha()"><div class="mo ${cls}">${html}</div></div>`; }
function fecha() { $('#ovs').innerHTML = ''; ED = null; render(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.ov')) fecha(); });

// ───────── início
(async () => {
  const me = await fetch('/api/me', { headers: { 'x-nerd': '1' } }).then(r => r.json()).catch(() => ({}));
  if (!me.authed) return showLogin();
  S.me = me.user;
  $('#app').classList.remove('hidden');
  const h = location.hash.slice(1); if (VIEWS[h]) S.view = h;
  S.brands = (await api('/api/brands').catch(() => ({ brands: [] }))).brands; S.gasto = await api('/api/v2/gastos').catch(() => null);
  await refresh(); loadChat().catch(() => { }); notifs(true).catch(() => { }); live(); setInterval(() => notifs().catch(() => { }), 30000);
  addEventListener('resize', () => renderSide());
})();
</script>
