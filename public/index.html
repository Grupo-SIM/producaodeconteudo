<title>Agentes SIM — Criação autônoma de conteúdo</title>
<meta name="theme-color" content="#050505">
<style>
:root{--bg:#050505;--panel:#0c0c0d;--panel2:#131314;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--tx:#ececec;--mut:#8b8b90;--dim:#5a5a5f;--acc:#d4d4d8;--acc2:#a1a1a6;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:14px;--grad:linear-gradient(135deg,#f4f4f5,#b4b4b9)}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--tx);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1000px 520px at 85% -10%,rgba(255,255,255,.04),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
::selection{background:rgba(255,255,255,0.22)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2a2d;border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

/* layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(12,12,13,.94),rgba(6,6,6,.94));display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 18px}
.logo{display:block;width:100%;max-width:200px;height:auto}.brand.wide{flex-direction:column;align-items:flex-start;gap:6px;padding:4px 8px 18px}.brand.wide small{padding-left:4px}
.brand b{display:block;font-size:15px;letter-spacing:.2px}.brand small{color:var(--mut);font-size:11.5px}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:1px solid transparent;border-radius:11px;background:none;color:var(--mut);cursor:pointer;text-align:left;transition:.15s}
.nav:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.nav.on{color:var(--tx);background:linear-gradient(135deg,rgba(255,255,255,0.099),rgba(255,255,255,0.044));border-color:rgba(255,255,255,0.193)}
.ofl{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:16px;align-items:start}.ofm{min-width:0}
.gdock .gchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.gdock .gchip{white-space:nowrap;flex:none}.gdock .gmsgs{padding:14px}
.card.gdock{padding:0}.gdock{position:sticky;top:12px;height:calc(100vh - 150px);min-height:520px;display:flex;flex-direction:column;padding:0;overflow:hidden;margin:0}
.gdh{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.gdtabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}.gdtabs button{flex:1;font:600 12.5px inherit;font-family:inherit;color:var(--mut);background:none;border:1px solid transparent;border-radius:8px;padding:7px 6px;cursor:pointer}.gdtabs button:hover{color:var(--tx)}.gdtabs button.on{color:var(--tx);background:rgba(255,255,255,.07);border-color:var(--line2)}
.gdock .gchat{flex:1;min-height:0;border:0;border-radius:0;margin:0;box-shadow:none;background:none}.gdock .gchat[hidden],.gdpane[hidden]{display:none}
.gdpane{flex:1;overflow:auto;padding:12px;min-height:0}.gdpane .cmds{grid-template-columns:1fr}.gdpane .card{margin:0}
@media(max-width:1180px){.ofl{grid-template-columns:1fr}.gdock{position:static;height:72vh}}
.tplg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.tplc{border:1px solid var(--bd);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--bg2,rgba(255,255,255,.02));cursor:default}.tplc[onclick],.vform .tplc{cursor:pointer}.tplc.on{border-color:var(--tx);box-shadow:0 0 0 1px var(--tx) inset}.tpls{display:flex;flex-wrap:wrap;gap:6px}.tplp{font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--bd);color:var(--mut)}
.aefx{border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin:8px 0}.aefx summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--tx);padding:2px 0}.aefx[open] summary{margin-bottom:6px}
.ve.simples .adv{display:none!important}.vemodo{margin-top:14px;width:100%}
.evorow{display:grid;grid-template-columns:160px 1fr 80px 90px;gap:12px;align-items:center}.evon{display:flex;gap:8px;align-items:center;min-width:0}.evon i{width:10px;height:10px;border-radius:50%;flex:none}.evon b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.evob{display:flex;gap:4px;align-items:flex-end;height:42px}.evoc{flex:1;height:100%;display:flex;flex-direction:column-reverse;gap:1px;background:rgba(255,255,255,.03);border-radius:4px;overflow:hidden}.evoc .o{background:#34d399}.evoc .b{background:#f87171}.evot{display:flex;flex-direction:column;align-items:flex-end}
@media(max-width:700px){.evorow{grid-template-columns:1fr 70px;}.evob{grid-column:1/-1;order:3}}
.lb{position:fixed;inset:0;z-index:200;background:rgba(5,5,7,.94);display:flex;flex-direction:column;padding:14px 18px;gap:10px}
.lbtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.lbtop b{font-size:15px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbc{color:var(--mut);font-size:13px}
.lbmid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:14px}.lbimg{max-height:100%;max-width:min(100%,900px);object-fit:contain;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lbnav{width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}.lbnav:hover{border-color:#6aa3ff}.lbnav.r svg{transform:scaleX(-1)}
.lbt{display:flex;gap:8px;justify-content:center;overflow-x:auto;padding-bottom:4px}.lbt button{flex:none;width:58px;height:72px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#000;cursor:pointer;opacity:.6}.lbt button.on{border-color:#6aa3ff;opacity:1}.lbt img{width:100%;height:100%;object-fit:cover}
@media(max-width:700px){.lbnav{display:none}.lbtop b{max-width:100%}}
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media(max-width:1000px){.gwrap{grid-template-columns:1fr}}
.gchat{display:flex;flex-direction:column;padding:0;height:calc(100vh - 170px);min-height:480px}
.gmsgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.gm{display:flex;gap:10px;align-items:flex-start;max-width:88%}.gm.me{align-self:flex-end;flex-direction:row-reverse}
.gbw{min-width:0;display:flex;flex-direction:column;gap:6px}.gn{font-size:11.5px;color:var(--mut);font-weight:600}
.gb{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;line-height:1.5;font-size:14px}
.gm.me .gb{background:rgba(255,255,255,.08);border-color:var(--line2)}
.gm.ag{width:88%}.gm.ag .gbw{flex:1}
.gm.ag .gb{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 7%,var(--panel2))}
.gact{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:12.5px;background:rgba(0,0,0,.25)}
.gact i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;margin-top:5px}.gact.bad i{background:var(--bad)}
.gact .t{flex:1;white-space:pre-wrap;word-break:break-word}
.gcomp{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.gchips{display:flex;gap:8px;flex-wrap:wrap}.gchip{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--mut);cursor:pointer;font-family:inherit}
.gchip:hover{color:var(--tx);border-color:var(--acc)}
.gin{display:flex;gap:10px;align-items:flex-end}.gin textarea{min-height:46px;max-height:180px;resize:none}
.gdots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mut);margin-right:4px;animation:gd 1.2s infinite}.gdots span:nth-child(2){animation-delay:.2s}.gdots span:nth-child(3){animation-delay:.4s}
@keyframes gd{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lib-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.lib-col{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--tx);font:inherit;cursor:pointer;transition:.15s;position:relative}
.lib-col:hover{border-color:var(--line2)}.lib-col.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset;background:rgba(255,255,255,.05)}
.lib-ci{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06);flex:none}
.lib-cn{margin-left:auto;font-weight:700;font-size:18px}
.lib-drop{display:flex;gap:14px;align-items:center;justify-content:center;border:1.5px dashed var(--line2);border-radius:14px;padding:22px;color:var(--mut);cursor:pointer;transition:.15s;background:rgba(255,255,255,.015)}
.lib-drop:hover,.lib-drop.on{border-color:var(--acc);color:var(--tx);background:rgba(255,255,255,.04)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.lib-card{min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.lib-card:hover{border-color:var(--line2);transform:translateY(-2px)}
.lib-prev{position:relative;height:150px;flex:none;background:repeating-conic-gradient(#171718 0% 25%, #101011 0% 50%) 50% / 16px 16px;display:grid;place-items:center;overflow:hidden}
.lib-prev img{width:100%;height:100%;object-fit:cover}.lib-prev.noimg{color:var(--mut)}
.lib-play{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center;color:#fff}
.lib-play .ic{fill:#fff;stroke:none;width:12px;height:12px}
.lib-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lib-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.lib-tags{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lib-card audio{width:100%;min-width:0;height:32px}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;background:var(--warn);color:#18130a;border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.mini{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;gap:7px}
.mini div{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}.dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
main{padding:28px clamp(18px,3vw,44px) 60px;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:26px;letter-spacing:-.4px;font-weight:700}.sub{color:var(--mut);margin-top:2px}
h2{font-size:15px;margin:0 0 12px;font-weight:650;letter-spacing:.1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.mt{margin-top:22px}.mut{color:var(--mut)}.small{font-size:12.5px}

/* controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.04);cursor:pointer;font-weight:550;transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--grad);color:#0a0a0a;border-color:transparent;box-shadow:0 10px 30px -12px rgba(255,255,255,0.44)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ok{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4);color:#7ff0c4}
.btn.danger{color:#ff9b9b;border-color:rgba(248,113,113,.3)}.btn.danger:hover{background:rgba(248,113,113,.12)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;background:#070708;border:1px solid var(--line2);border-radius:11px;padding:10px 12px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,255,255,0.099)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:550}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.help{color:var(--dim);font-size:12px;font-weight:400}
.switch{position:relative;display:inline-block;width:44px;height:25px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:2;margin:0}
.switch span{position:absolute;inset:0;background:#252527;border-radius:99px;transition:.2s;border:1px solid var(--line2)}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#9a9a9f;transition:.2s}
.switch input:checked+span{background:var(--grad);border-color:transparent}
.switch input:checked+span::after{transform:translateX(19px);background:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line2);color:var(--mut);background:rgba(255,255,255,.03)}
.pill.ok{color:#7ff0c4;border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.pill.warn{color:#ffd978;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
.pill.bad{color:#ff9b9b;border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.pill.acc{color:#d0d0d4;border-color:rgba(255,255,255,0.22);background:rgba(255,255,255,0.055)}
.banner{padding:12px 16px;border-radius:12px;margin-bottom:16px;border:1px solid}
.banner.info{background:rgba(255,255,255,0.055);border-color:rgba(255,255,255,0.193);color:#dcdce0}
.banner.warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);color:#ffd978}

/* kpis */
.kpi{padding:16px 18px}.kpi b{display:block;font-size:28px;letter-spacing:-.5px;font-weight:700;line-height:1.1}.kpi span{color:var(--mut);font-size:12.5px}
.bar{height:6px;border-radius:9px;background:#1c1c1e;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .4s}

/* equipe */
.agent{position:relative;overflow:hidden}
.agent .ava{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#0a0a0a;flex:none}
.agent.work{border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 25%,transparent),0 18px 50px -24px var(--c)}
.agent.work::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);background-size:200% 100%;animation:slide 1.6s linear infinite}
@keyframes slide{to{background-position:-200% 0}}
.agent .task{margin:14px 0 12px;min-height:44px;padding:10px 12px;border-radius:11px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:13px}
.agent .hd{display:flex;gap:12px;align-items:center;padding-right:100px;min-height:44px}.agent .st{position:absolute;top:16px;right:16px}
.swrow{display:flex;gap:12px;align-items:flex-start}.swrow>div:last-child{flex:1;min-width:0}
.agent .meta{display:flex;gap:14px;color:var(--mut);font-size:12px}.agent .meta b{color:var(--tx)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--c);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.feed{max-height:420px;overflow:auto;display:flex;flex-direction:column}
.feed .it{display:flex;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.feed .it:last-child{border:0}.feed time{color:var(--dim);font-size:12px;min-width:42px;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:7px;color:#0a0a0a;flex:none}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(245px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:200px}
.col h3{margin:2px 4px 12px;font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.8px;font-weight:650}
.col h3 em{font-style:normal;background:rgba(255,255,255,.07);border-radius:99px;padding:0 8px;color:var(--tx);font-size:12px}
.cc{padding:13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:.15s}
.cc:hover{border-color:rgba(255,255,255,0.275);transform:translateY(-1px)}
.cc b{display:block;font-weight:600;margin-bottom:8px;line-height:1.35}
.cc .row{gap:6px}
.stage{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--mut);font-size:12px}
.spin{width:12px;height:12px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--acc2);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{padding:26px 14px;text-align:center;color:var(--dim);font-size:13px}


/* kanban estilo Trello */
.kanban{display:flex;grid-auto-flow:unset;gap:12px;overflow-x:auto;align-items:flex-start;padding:2px 2px 16px}
.kanban .col{flex:0 0 288px;width:288px;min-height:0;max-height:calc(100vh - 170px);display:flex;flex-direction:column;background:#0e0e10;border:1px solid var(--line);border-top:3px solid var(--cc,#3a3a3f);border-radius:14px;padding:10px 8px 8px}
.kanban .col h3{margin:2px 6px 10px;font-size:14px;color:var(--tx);text-transform:none;letter-spacing:0;font-weight:700;justify-content:space-between}
.kanban .col h3 em{background:transparent;color:var(--dim);font-size:13px;padding:0;font-weight:600}
.colb{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:0 2px 2px;min-height:24px}
.kanban .cc{margin:0;padding:10px 12px 11px;border-radius:10px;background:#1c1c1f;border:1px solid transparent;box-shadow:0 1px 0 rgba(0,0,0,.5);position:relative}
.kanban .cc:hover{background:#242428;border-color:rgba(255,255,255,.16);transform:none}
.kanban .cc b{font-size:14px;font-weight:500;margin:0 0 8px;line-height:1.35;padding-right:18px}
.kanban .cc .clb{gap:4px;margin-bottom:7px}
.lbl{font-size:11px;font-weight:700;padding:2px 9px;border-radius:5px;background:#2a4a8a;color:#e6eeff}
.kanban .cc .stage{margin-top:8px}
.kanban .empty{padding:14px 8px;font-size:12.5px}
.addcard{display:flex;align-items:center;gap:8px;margin:8px 2px 0;padding:8px 10px;border-radius:9px;border:0;background:transparent;color:var(--mut);cursor:pointer;font:inherit;font-size:13.5px}
.addcard:hover{background:rgba(255,255,255,.06);color:var(--tx)}.addcard span{font-size:18px;line-height:1}
.col[data-c=blocked]{--cc:#ef4444}.col[data-c=roteiro]{--cc:#8b5cf6}.col[data-c=revisao]{--cc:#fb923c}.col[data-c=aprov_rot]{--cc:#f59e0b}.col[data-c=producao]{--cc:#22d3ee}.col[data-c=aprov_final]{--cc:#f59e0b}.col[data-c=pronto]{--cc:#34d399}.col[data-c=posted]{--cc:#6b7280}
.kanban .cc .cdel{top:8px;right:8px}


.tcard{position:relative;padding:8px 32px 8px 12px;border-radius:8px;background:#22272b;border:1px solid transparent;box-shadow:0 1px 1px rgba(0,0,0,.45),0 0 1px rgba(0,0,0,.4);cursor:pointer;color:#c7d1db;font-size:14px;line-height:1.4;transition:background .12s}
.tcard:hover{background:#2c333a;border-color:rgba(255,255,255,.14)}.tcard.sel{border-color:#fff;background:#2c333a}
.tcard .tt{display:block;word-break:break-word}
.tcard .cdel{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:6px;border:0;background:transparent;color:var(--mut);font-size:12px;cursor:pointer;opacity:0}
.tcard:hover .cdel{opacity:1;background:rgba(255,255,255,.08)}.tcard .cdel:hover{background:rgba(248,113,113,.18);color:#f87171}
.tcard .chk{position:absolute;right:8px;top:8px;width:18px;height:18px;border:2px solid var(--line2);border-radius:5px;display:grid;place-items:center;font-size:11px}
.kanban .col{background:#101204;background:#161618;border-top:0}
.kanban .col::before{content:'';height:3px;border-radius:3px;background:var(--cc,#3a3a3f);margin:-4px 4px 8px}

/* gaveta + modal */
.scrim{position:fixed;inset:0;background:rgba(2,3,6,.62);backdrop-filter:blur(3px);z-index:40;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100vw);background:#0b0e14;border-left:1px solid var(--line2);z-index:41;display:flex;flex-direction:column;animation:in .2s}
@keyframes in{from{transform:translateX(30px);opacity:0}}
.drawer header{padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow:auto;padding:18px 24px}
.drawer footer{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;background:#0a0c11}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
.tabs button{padding:7px 13px;border:0;background:none;color:var(--mut);cursor:pointer;border-radius:9px;font-weight:550;white-space:nowrap}
.tabs button:hover{color:var(--tx)}.tabs button.on{background:rgba(255,255,255,0.088);color:#dcdce0}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 28px));max-height:calc(100vh - 40px);overflow:auto;background:#0c0c0d;border:1px solid var(--line2);border-radius:18px;padding:24px;z-index:51;box-shadow:0 40px 100px -30px #000;animation:pop .15s}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}}
.modal h2{font-size:18px;margin-bottom:16px}.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.scrim.top{z-index:50}

/* markdown */
.md{font-size:14px;line-height:1.65}
.md h2,.md h3,.md h4,.md h5{margin:22px 0 8px;letter-spacing:.2px}.md h2{font-size:15px;color:#d0d0d4;text-transform:uppercase;letter-spacing:1px}.md h3{font-size:15px}
.md h2:first-child{margin-top:0}
.md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:22px}.md li{margin:3px 0}
.md code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px;font-size:12.5px}
.md table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line2);padding:7px 10px;text-align:left;vertical-align:top}.md th{background:rgba(255,255,255,.05)}
.score{font-size:46px;font-weight:800;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}.kv dt{color:var(--mut)}.kv dd{margin:0}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.02)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chart .r{display:grid;grid-template-columns:minmax(120px,220px) 1fr 120px;gap:12px;align-items:center;padding:6px 0;font-size:13px}
.chart .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.t2{width:100%;border-collapse:collapse;font-size:13px}.t2 th{color:var(--mut);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2)}.t2 td{padding:8px 10px;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:90}
.toast{padding:12px 16px;border-radius:12px;background:#151a26;border:1px solid var(--line2);box-shadow:0 18px 50px -20px #000;max-width:360px;animation:pop2 .2s}
.toast.err{border-color:rgba(248,113,113,.5)}.toast.ok{border-color:rgba(52,211,153,.5)}
@keyframes pop2{from{opacity:0;transform:translateY(10px)}}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(400px,100%);padding:30px}
.kbrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}.kbrow .kbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);min-width:48px}
.kbrow .btn.sm{white-space:nowrap}.btn.dash{border-style:dashed;color:var(--mut)}
.bpanel{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:14px}.bpanel .bn{font-size:20px;font-weight:800;letter-spacing:-.01em}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);font-family:ui-monospace,Menlo,monospace}.sw i{width:22px;height:22px;border-radius:7px;border:1px solid var(--line2);display:inline-block}
.kbchk{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
@media(max-width:700px){.kbrow .kbl{width:100%}.bpanel{flex-direction:column}.top{flex-direction:column;align-items:stretch}}
.klay{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;margin-top:16px;align-items:start}
.kside{position:sticky;top:16px;display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.kbh{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:6px 8px 8px}
.kbi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--tx);padding:7px 8px;border-radius:10px;cursor:pointer;font:inherit;font-size:13.5px}
.kbi:hover{background:rgba(255,255,255,.045)}.kbi.on{background:rgba(255,255,255,0.0825);border-color:rgba(255,255,255,0.275)}
.kdot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#fff;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.kbn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kbc{font-size:11.5px;color:var(--mut)}
.kbi.add{color:var(--mut);border:1px dashed var(--line2);margin-top:8px;justify-content:center}
.kmain{min-width:0}

function ivParse(text) {
  const vals = {}; let g = '';

    if (ln.startsWith('## ')) { g = ln.slice(3).trim(); continue; }
    const m = ln.match(/^([^:#]{1,40}):\s*(.*)$/); if (!m) continue;
    for (const [gn, , fs] of IV) if (gn === g) for (const f of fs) if (f[1] === m[1].trim()) vals[f[0]] = m[2].replace(/ \| /g, '\n');
  }

}
function ivCompose(nome, vals) {
  const out = ['# IDENTIDADE VISUAL — ' + nome, '(Vale para peças estáticas e para vídeo. O Designer e o Editor devem seguir isto à risca.)', ''];
  for (const [gn, , fs] of IV) {
    const ls = fs.filter(f => (vals[f[0]] || '').trim()).map(f => f[1] + ': ' + vals[f[0]].trim().replace(/\s*\n\s*/g, ' | '));
    if (ls.length) out.push('## ' + gn, ...ls, '');
  }
  return out.join('\n').trim();
}

}
