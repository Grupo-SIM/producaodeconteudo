<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>

.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}.top h1{font-size:22px;margin:0;letter-spacing:-.01em}.sp{flex:1}
.mut{color:var(--mut)}.small{font-size:12.5px}

.login{max-width:380px;margin:12vh auto}.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bg3);border:1px solid var(--bd)}

code{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:2px 6px;font-size:12px;word-break:break-all}
.empty{padding:30px;text-align:center;color:var(--mut)}
svg{flex:none}
@media(max-width:700px){th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}}
</style>
</head>
